# Publishes to https://apexops.pro. Live since the Pages/domain cutover
# completed September 22, 2026 (see README#hosting-cutover); gated by the
# DOCS_PUBLISH_ENABLED repository variable.
name: Publish Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DOCS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: npm run test:setup
      - run: npm run source:prepare
      - run: npm run build && npm run check:links && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Live read-only acceptance
        env:
          DOCS_URL: https://apexops.pro
        run: npm run test:browser
