# Documentation-only maintenance, independent of consumer Azure operations.
name: Weekly Documentation Checks
on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: npm run test:setup
      - run: npm run source:prepare
      - run: npm run build && npm run check:links && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run check:external-links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-docs-evidence
          path: |
            playwright-report/
            test-results/
