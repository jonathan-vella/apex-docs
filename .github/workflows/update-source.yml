# Propose a reviewed APEX source pin update; never merge automatically.
name: Update APEX Source
on:
  schedule:
    - cron: "21 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-apex-source
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run source:update
      - run: npm run source:prepare
      - name: Fetch migration provenance for parity tests
        run: |
          BASELINE=$(node -p 'JSON.parse(require("fs").readFileSync("migration-source.json")).commit')
          git -C .apex-source fetch --depth=1 https://github.com/jonathan-vella/apex.git "$BASELINE"
      - run: npm run build && npm run check:links && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/apex-source
          commit-message: "docs: Update pinned APEX metadata"
          title: "docs: Update pinned APEX metadata"
          body: "Automated source-pin and Explorer update. Build, parity and browser checks passed. Human review required."
          add-paths: |
            apex-source.json
            public/architecture-explorer-graph.json
