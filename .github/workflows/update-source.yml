# Propose a reviewed APEX source pin update; never merge automatically.
name: Update APEX Source
on:
  schedule:
    - cron: "21 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-apex-source
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: npm run test:setup
      - run: npm run source:update
      - run: npm run source:prepare
      - name: Report documentation impact since the last guidance review
        run: |
          REVIEWED=$(node -p 'JSON.parse(require("fs").readFileSync("docs-review.json")).apex.commit')
          [[ "$REVIEWED" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid guidance review commit"; exit 1; }
          git -C .apex-source fetch --depth=1 https://github.com/jonathan-vella/apex.git "$REVIEWED"
          npm run source:impact -- --output "$RUNNER_TEMP/apex-source-impact.md"
          cat "$RUNNER_TEMP/apex-source-impact.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch migration provenance for parity tests
        run: |
          BASELINE=$(node -p 'JSON.parse(require("fs").readFileSync("migration-source.json")).commit')
          git -C .apex-source fetch --depth=1 https://github.com/jonathan-vella/apex.git "$BASELINE"
      - run: npm run build && npm run check:links && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/apex-source
          commit-message: "docs: Update pinned APEX metadata"
          title: "docs: Update pinned APEX metadata"
          body-path: ${{ runner.temp }}/apex-source-impact.md
          add-paths: |
            apex-source.json
            public/architecture-explorer-graph.json
